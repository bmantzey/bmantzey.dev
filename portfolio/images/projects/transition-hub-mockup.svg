<svg width="600" height="1200" xmlns="http://www.w3.org/2000/svg">
  <!-- iPhone Frame -->
  <rect x="0" y="0" width="600" height="1200" rx="60" fill="#1d1d1f"/>
  <rect x="20" y="20" width="560" height="1160" rx="50" fill="#000000"/>
  
  <!-- Screen -->
  <rect x="30" y="80" width="540" height="1050" rx="40" fill="#ffffff"/>
  
  <!-- Status Bar -->
  <rect x="30" y="80" width="540" height="50" fill="#f5f5f7"/>
  <text x="60" y="112" font-family="Arial, sans-serif" font-size="18" fill="#000000" font-weight="600">9:41</text>
  
  <!-- Navigation Bar -->
  <rect x="30" y="130" width="540" height="60" fill="#0071e3"/>
  <text x="280" y="168" font-family="Arial, sans-serif" font-size="22" fill="#ffffff" font-weight="600" text-anchor="middle">Transition Hub</text>
  
  <!-- Content Area -->
  <g transform="translate(60, 220)">
    <!-- Header -->
    <text x="240" y="30" font-family="Arial, sans-serif" font-size="28" fill="#1d1d1f" font-weight="700" text-anchor="middle">Welcome to Schwab</text>
    <text x="240" y="65" font-family="Arial, sans-serif" font-size="16" fill="#6e6e73" text-anchor="middle">Your transition is in progress</text>
    
    <!-- Progress Bar -->
    <rect x="40" y="100" width="400" height="8" rx="4" fill="#e5e5ea"/>
    <rect x="40" y="100" width="280" height="8" rx="4" fill="#0071e3"/>
    
    <!-- Card 1 -->
    <rect x="0" y="150" width="480" height="120" rx="12" fill="#f5f5f7"/>
    <text x="20" y="185" font-family="Arial, sans-serif" font-size="18" fill="#1d1d1f" font-weight="600">Important Updates</text>
    <text x="20" y="215" font-family="Arial, sans-serif" font-size="14" fill="#6e6e73">Your account will transition on</text>
    <text x="20" y="235" font-family="Arial, sans-serif" font-size="14" fill="#6e6e73">March 15, 2024</text>
    
    <!-- Card 2 -->
    <rect x="0" y="290" width="480" height="120" rx="12" fill="#f5f5f7"/>
    <text x="20" y="325" font-family="Arial, sans-serif" font-size="18" fill="#1d1d1f" font-weight="600">Next Steps</text>
    <text x="20" y="355" font-family="Arial, sans-serif" font-size="14" fill="#6e6e73">• Download Schwab Mobile app</text>
    <text x="20" y="375" font-family="Arial, sans-serif" font-size="14" fill="#6e6e73">• Review your account details</text>
    
    <!-- Card 3 -->
    <rect x="0" y="430" width="480" height="100" rx="12" fill="#f5f5f7"/>
    <text x="20" y="465" font-family="Arial, sans-serif" font-size="18" fill="#1d1d1f" font-weight="600">Support Available</text>
    <text x="20" y="495" font-family="Arial, sans-serif" font-size="14" fill="#6e6e73">Contact us anytime for help</text>
    
    <!-- Button -->
    <rect x="140" y="570" width="200" height="48" rx="24" fill="#0071e3"/>
    <text x="240" y="599" font-family="Arial, sans-serif" font-size="16" fill="#ffffff" font-weight="600" text-anchor="middle">Learn More</text>
  </g>
  
  <!-- Home Indicator -->
  <rect x="230" y="1090" width="140" height="5" rx="2.5" fill="#ffffff"/>
</svg>
